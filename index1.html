<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/jpg" href="favicon.ico"/>
    <title>Robotron 2000</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;500&display=swap" rel="stylesheet"> 
</head>

<body>

    <main>
        <section class="robotron">
            <img class="robo" src="robotron.png" alt="Robotron">
            <button id="btn-anterior" class="troca-cor"><</button>
            <button id="btn-proximo" class="troca-cor">></button>
            <figcaption class="titulo">ROBOTRON <br>2000</figcaption>
        </section>

        <section class="box estatisticas">
            <div class="estatistica">
                <p class="estatistica-titulo">Força</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">768</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Poder</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">630</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Energia</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">289</p>
                </div>
            </div>
            <div class="estatistica">
                <p class="estatistica-titulo">Velocidade</p>
                <div class="estatistica-valor">
                    <p class="estatistica-numero">597</p>
                </div>
            </div>
        </section>

        <section class="equipamentos">
            <form action="" class="montador">
                <div class="box montador-conteudo">

                    <div class="peca">
                        <label class="peca-titulo">Braços</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Blindagem</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Núcleos</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Pernas</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                    <hr class="linha">

                    <div class="peca">
                        <label class="peca-titulo">Foguetes</label>
                        <div class="controle">
                            <button type="button" class="controle-ajuste">-</button>
                            <input type="text" class="controle-contador" value="00">
                            <button type="button" class="controle-ajuste">+</button>
                        </div>
                    </div>

                </div>

                <input type="submit" value="Iniciar produção" class="producao" id="producao">

            </form>
        </section>

    </main>

<script>
    // Troca de cor do robô
    const robo = document.querySelector(".robo");
    const cores = [
        "robotron.png",
        "robotron-vermelho.png",
        "robotron-branco.png",
        "robotron-rosa.png",
        "robotron-preto.png",
        "robotron-amarelo.png",
        "robotron-azul.png"
    ];
    let indice = 0;

    document.getElementById("btn-anterior").onclick = () => {
        indice = (indice - 1 + cores.length) % cores.length;
        robo.src = cores[indice];
    };

    document.getElementById("btn-proximo").onclick = () => {
        indice = (indice + 1) % cores.length;
        robo.src = cores[indice];
    };

    // Função dos botões + e - 
    const controles = document.querySelectorAll(".controle-ajuste");

    controles.forEach((controle) => {
        controle.addEventListener("click", (evento) => {
            const operacao = evento.target.textContent; // + ou -
            const contador = evento.target.parentNode.querySelector(".controle-contador");

            let valor = parseInt(contador.value);

            if (operacao === "+" && valor < 10) {
                valor++;
            } else if (operacao === "-" && valor > 0) {
                valor--;
            }

            contador.value = valor.toString().padStart(2, "0");
        });
    });

</script>

</body>
</html>
