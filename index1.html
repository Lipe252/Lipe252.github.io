<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #container {
            width: 400px;
            margin: 50px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        #container img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #000;
        }

        button {
            padding: 10px 15px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="container">
        <button onclick="voltar()"> << </button>

        <img id="foto" src="" alt="Imagem">

        <button onclick="avancar()"> >> </button>
    </div>

    <script>
        const imagens = [
            "robotron-vermelho.png",
            "robotron-azul.png",
            "robotron-branco.png",
            "robotron-amrelo.png",
            "robotron-preto.png"
        ];

        let indice = 0;

        document.getElementById("foto").src = imagens[indice];

        function avancar() {
            indice++;
            if (indice >= imagens.length) indice = 0;

            document.getElementById("foto").src = imagens[indice];
        }

        function voltar() {
            indice--;
            if (indice < 0) indice = imagens.length - 1;

            document.getElementById("foto").src = imagens[indice];
        }
    </script>

</body>
</html>
